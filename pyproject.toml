[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-log-analyzer"
version = "0.1.0"
description = "Local web and application log analysis"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "rich>=13.9", "typer>=0.12"]

[project.scripts]
log-analyzer = "log_analyzer.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
